<div class="mb-dashboard">
  <!-- ko if: hasError -->
  <div class="mb-banner mb-banner--error" role="alert">
    <strong>Some dashboard data could not load</strong>
    <span data-bind="text: error"></span>
  </div>
  <!-- /ko -->

  <div class="mb-dashboard__lead">
    <section class="mb-cash-hero" aria-labelledby="cashPositionTitle">
      <div class="mb-cash-hero__top">
        <div>
          <p class="mb-cash-hero__eyebrow" data-bind="text: heroEyebrow"></p>
          <h2 id="cashPositionTitle" data-bind="text: heroTitle"></h2>
        </div>
      </div>
      <p class="mb-cash-hero__amount" data-bind="text: heroValueDisplay"></p>
      <p class="mb-cash-hero__trend-detail" data-bind="text: heroDetail"></p>
      <div class="mb-cash-hero__meta" data-bind="foreach: heroMeta"><span><strong data-bind="text: value"></strong><small data-bind="text: label"></small></span></div>
    </section>

    <aside class="mb-card mb-quick-actions" aria-labelledby="quickActionsTitle">
      <div class="mb-card__header">
        <div><h2 id="quickActionsTitle" class="mb-card__title">Quick Actions</h2><p class="mb-card__subtitle">Start your most frequent tasks</p></div>
      </div>
      <div class="mb-quick-actions__list" data-bind="foreach: quickActions"><button type="button" class="mb-quick-action" data-bind="click: action"><span class="mb-quick-action__icon" aria-hidden="true" data-bind="text: glyph"></span><span><strong data-bind="text: title"></strong><small data-bind="text: detail"></small></span><span aria-hidden="true">›</span></button></div>
    </aside>
  </div>

  <section class="mb-kpi-grid" aria-label="Role performance" data-bind="foreach: kpis"><article class="mb-card mb-kpi-card"><span class="mb-kpi-card__icon" aria-hidden="true" data-bind="text: glyph"></span><div><p data-bind="text: label"></p><strong data-bind="text: value"></strong><small data-bind="text: hint, css: tone"></small></div></article></section>

  <section class="mb-card mb-card--flush mb-data-card">
    <div class="mb-card__bar">
      <div><h2 class="mb-card__title">Recent Transactions</h2><p class="mb-card__subtitle">Latest activity recorded at your branch</p></div>
      <!-- ko if: showGlobalTransactions --><button type="button" class="mb-text-button" data-bind="click: function () { goTo('transactions'); }">View all <span aria-hidden="true">→</span></button><!-- /ko -->
    </div>
    <!-- ko if: loading -->
    <div class="mb-empty mb-loading-state"><span class="mb-dot-loader" role="status" aria-label="Loading recent transactions"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><p class="mb-empty__body">Loading recent transactions…</p></div>
    <!-- /ko -->
    <!-- ko if: !loading() && !dashboardRecent().length -->
    <div class="mb-empty"><p class="mb-empty__title">No transactions yet</p><p class="mb-empty__body">New branch activity will appear here.</p></div>
    <!-- /ko -->
    <!-- ko if: dashboardRecent().length -->
    <div class="mb-responsive-table">
      <table class="mb-premium-table">
        <thead><tr><th>Transaction</th><th>Customer</th><th>Reference</th><th>Channel</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody data-bind="foreach: dashboardRecent">
          <tr>
            <td><div class="mb-table-primary"><span data-bind="css: glyphClass, text: arrow"></span><span><strong data-bind="text: title"></strong><small data-bind="text: when"></small></span></div></td>
            <td data-bind="text: customer"></td>
            <td class="mb-mono" data-bind="text: reference"></td>
            <td data-bind="text: rail"></td>
            <td><span data-bind="css: moneyClass, text: amount"></span></td>
            <td><span data-bind="css: statusTone, text: status"></span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- /ko -->
  </section>
</div>
