openapi: 3.0.3
info:
  title: Moneybags Customer Service API
  version: 1.0.0
  description: >-
    Customer/CIF, address, KYC, risk, communication preference, nominee,
    beneficiary, eligibility, expiry-alert and transactional-outbox APIs.
    All examples are fictional demo-profile data.
servers:
  - url: http://localhost:8090
    description: API Gateway
  - url: http://localhost:8082
    description: Customer Service directly
tags:
  - name: Customers
  - name: Addresses
  - name: KYC
  - name: Beneficiaries
  - name: Events
paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Customer'}
    post:
      tags: [Customers]
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCreateRequest'}
            example:
              firstName: Meera
              lastName: Joshi
              dob: '1994-04-12'
              gender: FEMALE
              mobile: '9898989898'
              email: meera.joshi@example.test
              panNo: PQRST6789L
              status: ACTIVE
              kycStatus: PENDING
      responses:
        '201':
          description: Customer registered with a generated CIF
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/customers/search:
    get:
      tags: [Customers]
      operationId: searchCustomers
      parameters:
        - in: query
          name: query
          required: true
          schema: {type: string}
          example: Vikram
      responses:
        '200':
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Customer'}
  /api/v1/customers/{cif}:
    parameters:
      - $ref: '#/components/parameters/Cif'
    get:
      tags: [Customers]
      operationId: getCustomer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Customers]
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerUpdateRequest'}
            example:
              firstName: Ananya
              lastName: Deshmukh
              dob: '1995-07-25'
              gender: FEMALE
              mobile: '9876543210'
              email: ananya.updated@example.test
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
  /api/v1/customers/{cif}/summary:
    get:
      tags: [Customers]
      operationId: customerSummary
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: Customer, profile-completeness and eligibility summary
  /api/v1/customers/{cif}/completeness:
    get:
      tags: [Customers]
      operationId: customerCompleteness
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: Profile completeness
          content:
            application/json:
              example: {completedFields: 7, totalFields: 7, percentage: 100}
  /api/v1/customers/{cif}/eligibility:
    get:
      tags: [Customers]
      operationId: accountEligibility
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: Account-service eligibility decision
          content:
            application/json:
              example:
                cifNo: CIF900101
                eligible: true
                customerStatus: ACTIVE
                kycStatus: VERIFIED
                riskClassification: LOW
                adult: true
                residentAddressAvailable: true
                reasons: []
  /api/v1/customers/{cif}/status:
    patch:
      tags: [Customers]
      operationId: setCustomerStatus
      parameters:
        - $ref: '#/components/parameters/Cif'
        - in: query
          name: status
          required: true
          schema: {$ref: '#/components/schemas/CustomerStatus'}
      responses:
        '200': {description: Updated customer}
  /api/v1/customers/{cif}/risk-classification:
    put:
      tags: [Customers]
      operationId: classifyCustomerRisk
      parameters: [{$ref: '#/components/parameters/Cif'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RiskUpdate'}
            example: {riskClassification: HIGH}
      responses:
        '200': {description: Updated customer}
  /api/v1/customers/{cif}/communication-preferences:
    get:
      tags: [Customers]
      operationId: getCommunicationPreferences
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: Communication preferences
          content:
            application/json:
              example: {preferredChannel: EMAIL, emailEnabled: true, smsEnabled: true, pushEnabled: false}
    put:
      tags: [Customers]
      operationId: updateCommunicationPreferences
      parameters: [{$ref: '#/components/parameters/Cif'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunicationPreferences'}
            example: {preferredChannel: SMS, emailEnabled: true, smsEnabled: true, pushEnabled: false}
      responses:
        '200': {description: Updated customer}
  /api/v1/customers/{cif}/relationship-manager/{employeeId}:
    put:
      tags: [Customers]
      operationId: assignRelationshipManager
      parameters:
        - $ref: '#/components/parameters/Cif'
        - in: path
          name: employeeId
          required: true
          schema: {type: integer, format: int64}
          example: 1002
      responses:
        '200': {description: Updated customer}
  /api/v1/customers/{cif}/relationship-manager:
    delete:
      tags: [Customers]
      operationId: removeRelationshipManager
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200': {description: Updated customer}
  /api/v1/customers/relationship-manager/{employeeId}:
    get:
      tags: [Customers]
      operationId: customersByRelationshipManager
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: {type: integer, format: int64}
          example: 1002
      responses:
        '200': {description: Assigned customers}
  /api/v1/customers/{cif}/addresses:
    get:
      tags: [Addresses]
      operationId: listAddresses
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: Customer addresses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Address'}
    post:
      tags: [Addresses]
      operationId: addAddress
      parameters: [{$ref: '#/components/parameters/Cif'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressRequest'}
            example:
              addressType: OFFICE
              line1: 15 Demo Business Park
              city: Pune
              state: Maharashtra
              pincode: '411001'
              country: India
              isCurrent: true
      responses:
        '201': {description: Address added}
  /api/v1/customers/{cif}/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/Cif'
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Addresses]
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressRequest'}
      responses:
        '200': {description: Address updated}
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      responses:
        '204': {description: Address deleted}
  /api/v1/customers/{cif}/kyc-documents:
    get:
      tags: [KYC]
      operationId: listKycDocuments
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200':
          description: KYC metadata; raw document number is never returned
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/KycDocument'}
    post:
      tags: [KYC]
      operationId: submitKycDocument
      parameters: [{$ref: '#/components/parameters/Cif'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycSubmitRequest'}
            example:
              docType: PAN_CARD
              docNumber: XYZPS5678G
              expiryDate: '2030-07-25'
              filePath: demo://kyc/CIF900102/pan-card
      responses:
        '201': {description: KYC reference stored and number hashed}
  /api/v1/customers/{cif}/kyc-documents/{documentId}/assignment/{employeeId}:
    put:
      tags: [KYC]
      operationId: assignKycDocument
      parameters:
        - $ref: '#/components/parameters/Cif'
        - $ref: '#/components/parameters/DocumentId'
        - in: path
          name: employeeId
          required: true
          schema: {type: integer, format: int64}
          example: 1002
      responses:
        '200': {description: KYC document assigned}
  /api/v1/customers/{cif}/kyc-documents/{documentId}/decision:
    patch:
      tags: [KYC]
      operationId: decideKycDocument
      parameters:
        - $ref: '#/components/parameters/Cif'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycDecisionRequest'}
            examples:
              verify:
                value: {status: VERIFIED, employeeId: 1002}
              reject:
                value: {status: REJECTED, employeeId: 1002, rejectionReason: Image is unreadable}
      responses:
        '200': {description: KYC decision saved and event added to the outbox}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/customers/kyc/pending:
    get:
      tags: [KYC]
      operationId: pendingKycDocuments
      responses:
        '200': {description: Pending KYC documents}
  /api/v1/customers/kyc/re-kyc-required:
    get:
      tags: [KYC]
      operationId: reKycRequired
      responses:
        '200': {description: Documents expired or expiring within 30 days}
  /api/v1/customers/kyc/expiry-alerts/process:
    post:
      tags: [KYC]
      operationId: processKycExpiryAlerts
      parameters:
        - in: query
          name: asOfDate
          required: false
          schema: {type: string, format: date}
          example: '2029-03-01'
      responses:
        '200':
          description: Number of new expiry events recorded
          content:
            application/json:
              example: {alertsCreated: 1}
  /api/v1/customers/{cif}/kyc-rejections:
    get:
      tags: [KYC]
      operationId: kycRejectionHistory
      parameters: [{$ref: '#/components/parameters/Cif'}]
      responses:
        '200': {description: Rejection-attempt history}
  /api/v1/customers/{cif}/beneficiaries:
    get:
      tags: [Beneficiaries]
      operationId: listBeneficiaries
      parameters:
        - $ref: '#/components/parameters/Cif'
        - in: query
          name: status
          schema: {type: string, enum: [PENDING_ACTIVATION, ACTIVE, BLOCKED]}
        - in: query
          name: beneficiaryType
          schema: {type: string, enum: [BANK_ACCOUNT, NOMINEE]}
      responses:
        '200':
          description: Beneficiaries or nominees
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Beneficiary'}
    post:
      tags: [Beneficiaries]
      operationId: addBeneficiary
      parameters: [{$ref: '#/components/parameters/Cif'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BeneficiaryRequest'}
            examples:
              bankBeneficiary:
                value:
                  beneficiaryName: Neha Rao
                  beneficiaryAccountNo: '999999999999'
                  beneficiaryBankName: Demo Bank
                  beneficiaryIfsc: DEMO0000123
                  beneficiaryNickname: Neha
                  beneficiaryType: BANK_ACCOUNT
              nominee:
                value:
                  beneficiaryName: Neha Rao
                  beneficiaryAccountNo: '000000000001'
                  beneficiaryBankName: Moneybags Nominee Registry
                  beneficiaryIfsc: MBAG0000001
                  beneficiaryNickname: Primary nominee
                  beneficiaryType: NOMINEE
      responses:
        '201': {description: Added in PENDING_ACTIVATION state}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/customers/{cif}/beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: '#/components/parameters/Cif'
      - $ref: '#/components/parameters/BeneficiaryId'
    put:
      tags: [Beneficiaries]
      operationId: updateBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BeneficiaryRequest'}
      responses:
        '200': {description: Updated and cooling period restarted}
    delete:
      tags: [Beneficiaries]
      operationId: deleteBeneficiary
      responses:
        '204': {description: Beneficiary deleted; history retained}
  /api/v1/customers/{cif}/beneficiaries/{beneficiaryId}/activate:
    post:
      tags: [Beneficiaries]
      operationId: activateBeneficiary
      parameters:
        - $ref: '#/components/parameters/Cif'
        - $ref: '#/components/parameters/BeneficiaryId'
      responses:
        '200': {description: Activated after the 24-hour cooling period and event recorded}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/customers/{cif}/beneficiaries/{beneficiaryId}/eligibility:
    get:
      tags: [Beneficiaries]
      operationId: beneficiaryEligibility
      parameters:
        - $ref: '#/components/parameters/Cif'
        - $ref: '#/components/parameters/BeneficiaryId'
      responses:
        '200':
          description: Transaction-service beneficiary validation
  /api/v1/customers/{cif}/beneficiaries/{beneficiaryId}/block:
    patch:
      tags: [Beneficiaries]
      operationId: setBeneficiaryBlocked
      parameters:
        - $ref: '#/components/parameters/Cif'
        - $ref: '#/components/parameters/BeneficiaryId'
        - in: query
          name: blocked
          required: true
          schema: {type: boolean}
      responses:
        '200': {description: Beneficiary state updated}
  /api/v1/customers/beneficiaries/{beneficiaryId}/history:
    get:
      tags: [Beneficiaries]
      operationId: beneficiaryHistory
      parameters: [{$ref: '#/components/parameters/BeneficiaryId'}]
      responses:
        '200': {description: Beneficiary change history}
  /api/v1/customers/events:
    get:
      tags: [Events]
      operationId: listCustomerEvents
      description: RabbitMQ-ready transactional outbox inspection endpoint; no broker is configured now.
      parameters:
        - in: query
          name: status
          required: false
          schema: {type: string, enum: [PENDING, PUBLISHED, FAILED]}
          example: PENDING
      responses:
        '200':
          description: Outbox events
components:
  parameters:
    Cif:
      in: path
      name: cif
      required: true
      schema: {type: string}
      example: CIF900101
    AddressId:
      in: path
      name: addressId
      required: true
      schema: {type: integer, format: int64}
      example: 2001
    DocumentId:
      in: path
      name: documentId
      required: true
      schema: {type: integer, format: int64}
      example: 3100
    BeneficiaryId:
      in: path
      name: beneficiaryId
      required: true
      schema: {type: integer, format: int64}
      example: 4001
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Business-rule conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    CustomerStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DECEASED, BLOCKED]
    CustomerCreateRequest:
      type: object
      required: [firstName, dob, gender, mobile, panNo, status, kycStatus]
      properties:
        userId: {type: integer, format: int64, nullable: true}
        firstName: {type: string, maxLength: 80}
        lastName: {type: string, maxLength: 80}
        dob: {type: string, format: date}
        gender: {type: string, enum: [MALE, FEMALE, NON_BINARY, UNDISCLOSED]}
        mobile: {type: string, pattern: '^[6-9][0-9]{9}$'}
        email: {type: string, format: email}
        panNo: {type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'}
        status: {$ref: '#/components/schemas/CustomerStatus'}
        kycStatus: {type: string, enum: [PENDING], description: Registration always starts as PENDING.}
    CustomerUpdateRequest:
      type: object
      properties:
        firstName: {type: string}
        lastName: {type: string}
        dob: {type: string, format: date}
        gender: {type: string, enum: [MALE, FEMALE, NON_BINARY, UNDISCLOSED]}
        mobile: {type: string}
        email: {type: string, format: email}
    CommunicationPreferences:
      type: object
      required: [preferredChannel, emailEnabled, smsEnabled, pushEnabled]
      properties:
        preferredChannel: {type: string, enum: [EMAIL, SMS, PUSH, NONE]}
        emailEnabled: {type: boolean}
        smsEnabled: {type: boolean}
        pushEnabled: {type: boolean}
    RiskUpdate:
      type: object
      required: [riskClassification]
      properties:
        riskClassification: {type: string, enum: [LOW, MEDIUM, HIGH]}
    Customer:
      type: object
      properties:
        cifNo: {type: string, example: CIF900101}
        userId: {type: integer, format: int64, nullable: true}
        relationshipManagerEmpId: {type: integer, format: int64, nullable: true}
        firstName: {type: string}
        lastName: {type: string}
        dob: {type: string, format: date}
        gender: {type: string, enum: [MALE, FEMALE, NON_BINARY, UNDISCLOSED]}
        mobile: {type: string}
        email: {type: string, format: email}
        panNo: {type: string}
        status: {$ref: '#/components/schemas/CustomerStatus'}
        kycStatus: {type: string, enum: [PENDING, VERIFIED, REJECTED, EXPIRED]}
        riskClassification: {type: string, enum: [LOW, MEDIUM, HIGH]}
        preferredCommunicationChannel: {type: string, enum: [EMAIL, SMS, PUSH, NONE]}
        emailNotificationsEnabled: {type: boolean}
        smsNotificationsEnabled: {type: boolean}
        pushNotificationsEnabled: {type: boolean}
        kycFailureCount: {type: integer}
    AddressRequest:
      type: object
      required: [addressType, line1, city, state, pincode, country, isCurrent]
      properties:
        addressType: {type: string, enum: [RESIDENTIAL, PERMANENT, OFFICE]}
        line1: {type: string}
        city: {type: string}
        state: {type: string}
        pincode: {type: string}
        country: {type: string}
        isCurrent: {type: boolean}
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressRequest'
        - type: object
          properties:
            addressId: {type: integer, format: int64}
    KycSubmitRequest:
      type: object
      required: [docType, docNumber, filePath]
      properties:
        docType: {type: string}
        docNumber: {type: string, writeOnly: true}
        expiryDate: {type: string, format: date, nullable: true}
        filePath: {type: string, description: Opaque secure-storage reference}
    KycDecisionRequest:
      type: object
      required: [status, employeeId]
      properties:
        status: {type: string, enum: [VERIFIED, REJECTED]}
        employeeId: {type: integer, format: int64}
        rejectionReason: {type: string, nullable: true}
    KycDocument:
      type: object
      properties:
        docId: {type: integer, format: int64}
        docType: {type: string}
        documentNumberHash: {type: string, minLength: 64, maxLength: 64}
        expiryDate: {type: string, format: date, nullable: true}
        filePath: {type: string}
        verifyStatus: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        assignedToEmpId: {type: integer, format: int64, nullable: true}
        verifiedByEmpId: {type: integer, format: int64, nullable: true}
        rejectionReason: {type: string, nullable: true}
        submittedAt: {type: string, format: date-time}
        verifiedAt: {type: string, format: date-time, nullable: true}
        expiryAlertedAt: {type: string, format: date-time, nullable: true}
    BeneficiaryRequest:
      type: object
      required: [beneficiaryName, beneficiaryAccountNo, beneficiaryIfsc, beneficiaryType]
      properties:
        beneficiaryName: {type: string}
        beneficiaryAccountNo: {type: string}
        beneficiaryBankName: {type: string}
        beneficiaryIfsc: {type: string}
        beneficiaryNickname: {type: string}
        beneficiaryType: {type: string, enum: [BANK_ACCOUNT, NOMINEE]}
    Beneficiary:
      allOf:
        - $ref: '#/components/schemas/BeneficiaryRequest'
        - type: object
          properties:
            beneficiaryId: {type: integer, format: int64}
            status: {type: string, enum: [PENDING_ACTIVATION, ACTIVE, BLOCKED]}
            addedAt: {type: string, format: date-time}
            activatedAt: {type: string, format: date-time, nullable: true}
    Error:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        message: {type: string}
        path: {type: string}
