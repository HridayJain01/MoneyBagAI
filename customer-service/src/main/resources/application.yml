server:
  port: 8082
spring:
  profiles:
    default: demo
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/mydb}
    username: ${CUSTOMER_DB_USERNAME:root}
    password: ${CUSTOMER_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
customer:
  kyc-expiry-alert-cron: ${KYC_EXPIRY_ALERT_CRON:0 0 8 * * *}
