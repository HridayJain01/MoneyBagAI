name: Customer Service Tests

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "services/customer-service/**"
      - ".github/workflows/customer-service-tests.yml"

  pull_request:
    paths:
      - "services/customer-service/**"
      - ".github/workflows/customer-service-tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Run Customer Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # Built through the root aggregator so the module resolves the same way it
      # does locally. -am builds any reactor dependencies customer-service needs.
      - name: Run customer-service tests
        run: mvn --batch-mode -pl services/customer-service -am clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-service-test-reports
          path: |
            services/customer-service/target/surefire-reports/**
            services/customer-service/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
