name: Customer Service Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "customer-service/**"
      - ".github/workflows/customer-service-tests.yml"

  pull_request:
    paths:
      - "customer-service/**"
      - ".github/workflows/customer-service-tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Run Customer Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: customer-service/pom.xml

      - name: Make Maven Wrapper executable
        if: ${{ hashFiles('customer-service/mvnw') != '' }}
        run: chmod +x mvnw

      - name: Run all tests with Maven Wrapper
        if: ${{ hashFiles('customer-service/mvnw') != '' }}
        run: ./mvnw --batch-mode clean verify

      - name: Run all tests with installed Maven
        if: ${{ hashFiles('customer-service/mvnw') == '' }}
        run: mvn --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-service-test-reports
          path: |
            customer-service/target/surefire-reports/**
            customer-service/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7