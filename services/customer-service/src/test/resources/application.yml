spring:
  datasource:
    url: jdbc:h2:mem:customerdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
springdoc:
  api-docs:
    path: /api-docs
