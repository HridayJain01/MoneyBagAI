server:
  port: 8091
  forward-headers-strategy: framework

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:mysql://localhost:3306/moneybags_audit?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${AUDIT_DB_USERNAME:root}
    password: ${AUDIT_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
