server:
  port: ${NOTIFICATION_SERVICE_PORT:8089}
  forward-headers-strategy: framework

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/moneybags_notification?createDatabaseIfNotExist=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      platform: ${SQL_INIT_PLATFORM:oracle}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

moneybags:
  notification:
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    fixed-delay-ms: ${NOTIFICATION_DELAY_MS:5000}
