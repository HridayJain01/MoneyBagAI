server:
  port: ${ACCOUNT_SERVICE_PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/moneybags_account?createDatabaseIfNotExist=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      platform: ${SQL_INIT_PLATFORM:oracle}

moneybags:
  account:
    default-currency: ${DEFAULT_CURRENCY:INR}
    dormancy-days: ${ACCOUNT_DORMANCY_DAYS:365}
    outbox:
      enabled: ${ACCOUNT_OUTBOX_ENABLED:true}
      batch-size: ${ACCOUNT_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${ACCOUNT_OUTBOX_MAX_ATTEMPTS:10}
      fixed-delay-ms: ${ACCOUNT_OUTBOX_DELAY_MS:5000}
    reconciliation:
      enabled: ${ACCOUNT_RECONCILIATION_ENABLED:true}
      fixed-delay-ms: ${ACCOUNT_RECONCILIATION_DELAY_MS:60000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
