server:
  port: ${TRANSACTION_SERVICE_PORT:8084}
  forward-headers-strategy: framework
spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/moneybags_transaction?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
moneybags:
  transaction:
    default-currency: ${DEFAULT_CURRENCY:INR}
    mini-statement-size: ${TRANSACTION_MINI_STATEMENT_SIZE:10}
    outbox:
      batch-size: ${TRANSACTION_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${TRANSACTION_OUTBOX_DELAY_MS:5000}
      max-attempts: ${TRANSACTION_OUTBOX_MAX_ATTEMPTS:10}
    ledger:
      cash-asset: ${GL_CASH_ASSET:110100}
      account-deposit-control: ${GL_ACCOUNT_DEPOSIT_CONTROL:210000}
      term-deposit-control: ${GL_TERM_DEPOSIT_CONTROL:210100}
      internal-clearing: ${GL_INTERNAL_CLEARING:220100}
      external-clearing: ${GL_EXTERNAL_CLEARING:220200}
      fee-income: ${GL_FEE_INCOME:410100}
