server:
  port: ${LEDGER_SERVICE_PORT:8085}
  forward-headers-strategy: framework

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/moneybags_ledger?createDatabaseIfNotExist=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      platform: ${SQL_INIT_PLATFORM:oracle}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

moneybags:
  ledger:
    # INR to match transaction-service, product-service and account-service. A USD
    # default here would reject every journal the rest of the system posts.
    default-currency: ${DEFAULT_CURRENCY:INR}
    accounts:
      cash-asset: ${GL_CASH_ASSET:110100}
      account-deposit-control: ${GL_ACCOUNT_DEPOSIT_CONTROL:210000}
      term-deposit-control: ${GL_TERM_DEPOSIT_CONTROL:210100}
      internal-clearing: ${GL_INTERNAL_CLEARING:220100}
      external-clearing: ${GL_EXTERNAL_CLEARING:220200}
      fee-income: ${GL_FEE_INCOME:410100}
