server:
  port: ${STATEMENT_SERVICE_PORT:8086}
  forward-headers-strategy: framework
spring:
  application:
    name: statement-reporting-service
  datasource:
    url: ${STATEMENT_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/moneybags_statement?createDatabaseIfNotExist=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: ${FLYWAY_ENABLED:true}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
management.endpoints.web.exposure.include: health,info,metrics
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
moneybags.statement:
  storage-directory: ${STATEMENT_STORAGE_DIR:./data/statements}
  download-secret: ${STATEMENT_DOWNLOAD_SECRET:change-this-development-secret-before-production}
  download-link-minutes: ${STATEMENT_DOWNLOAD_LINK_MINUTES:10}
  file-retention-days: ${STATEMENT_FILE_RETENTION_DAYS:30}
  worker-delay-ms: ${STATEMENT_WORKER_DELAY_MS:2000}
